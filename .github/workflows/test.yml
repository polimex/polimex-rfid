name: Tests

on:
  push:
    branches: [19.0]
  workflow_dispatch:

env:
  ODOO_VERSION: '19.0'
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Backend tests on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout polimex modules
        uses: actions/checkout@v6
        with:
          path: addons/polimex

      - name: Checkout polimex-ws (hr_rfid dependency)
        uses: actions/checkout@v6
        with:
          repository: polimex/polimex-ws
          ref: '19.0'
          path: addons/polimex-ws

      - name: Cache Odoo source
        id: odoo-cache
        uses: actions/cache@v5
        with:
          path: odoo
          key: odoo-${{ env.ODOO_VERSION }}-${{ runner.os }}

      - name: Clone Odoo ${{ env.ODOO_VERSION }}
        if: steps.odoo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch ${{ env.ODOO_VERSION }} \
            https://github.com/odoo/odoo.git odoo

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: odoo/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libldap2-dev \
            libsasl2-dev \
            libxml2-dev \
            libxslt1-dev \
            libjpeg-dev \
            libpq-dev \
            libssl-dev

      - name: Install Odoo Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r odoo/requirements.txt

      - name: Install module-specific Python dependencies
        run: |
          # defusedxml is required by polimex_ip_cam.
          pip install defusedxml
          # fdb (Firebird driver) is required by hr_rfid_andromeda_import only;
          # the binary client may not install on every runner — make this best-effort.
          pip install fdb || echo "fdb install failed; hr_rfid_andromeda_import tests will be skipped"
          # coverage is only used by the workflow_dispatch path.
          pip install coverage

      - name: Initialise test database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          # Drop any pre-existing test DB so the run starts clean.
          psql -c "DROP DATABASE IF EXISTS polimex_test;" postgres
          psql -c "CREATE DATABASE polimex_test OWNER odoo;" postgres

      - name: Compute installable module list
        id: modules
        run: |
          # Build a comma-separated list of installable modules whose
          # external Python deps are present on this runner. fdb is the
          # only known optional dep and gates hr_rfid_andromeda_import.
          MODULES=$(python <<'PY'
          import ast, importlib.util, pathlib
          root = pathlib.Path("addons/polimex")
          mods = []
          for d in sorted(root.iterdir()):
              manifest = d / "__manifest__.py"
              if not manifest.exists():
                  continue
              try:
                  m = ast.literal_eval(manifest.read_text())
              except Exception:
                  continue
              if not m.get("installable", True):
                  continue
              ext_py = m.get("external_dependencies", {}).get("python", [])
              missing = [pkg for pkg in ext_py if importlib.util.find_spec(pkg) is None]
              if missing:
                  print(f"SKIP {d.name} — missing python deps: {missing}")
                  continue
              mods.append(d.name)
          print("MODS=" + ",".join(mods))
          PY
          )
          INSTALL_LIST="${MODULES##*MODS=}"
          echo "Installing: $INSTALL_LIST"
          echo "list=$INSTALL_LIST" >> $GITHUB_OUTPUT

      - name: Install polimex modules
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python odoo/odoo-bin \
            -d polimex_test \
            -i "${{ steps.modules.outputs.list }}" \
            --no-http --stop-after-init \
            --addons-path=odoo/addons,addons/polimex,addons/polimex-ws \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --log-level=warn

      - name: Run backend tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          # Tag set covers every test class added by this audit. Listed
          # explicitly (instead of /<module>) to keep failures pinpointable.
          # Note: 'rfid_service' is NOT included — that tag is shared
          # between the new lifecycle suite (which we want) and the
          # legacy RFIDServices.test_rfid_services HttpCase that needs a
          # full hardware-controller fixture set up via the iCon factory
          # in hr_rfid.tests.controller. The legacy test runs locally
          # but not on a clean CI DB; we cover the same flow at the
          # model layer through 'rfid_service_lifecycle'.
          # 'rfid' covers the full hr_rfid suite (rfid_card / rfid_apb /
          # rfid_events / rfid_security / rfid_webstack / rfid_commands /
          # rfid_constraints / rfid_access_group / rfid_schedules /
          # rfid_wizards / rfid_hardware) — ~163 tests in one tag.
          # 'rfid_vending' covers the full vending suite incl. auto-refill
          # and ev64. Sister modules each carry their own dedicated tag.
          TAGS="rfid,rfid_vending,sot_denied,hr_attendance_late,rfid_site_manager,rfid_site_manager_tour,rfid_voting,refresh_mixin,rfid_service_lifecycle,rfid_service_portal_security,rfid_pms,rfid_odoo_import,rfid_old_cloud_import,polimex_ip_cam,rfid_portal,rfid_refresh_views,rfid_hourly_cost,rfid_zpl_labels,rfid_attendance_zone"
          python odoo/odoo-bin \
            -d polimex_test \
            --test-enable --test-tags="$TAGS" \
            -u "${{ steps.modules.outputs.list }}" \
            --no-http --stop-after-init \
            --addons-path=odoo/addons,addons/polimex,addons/polimex-ws \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --log-level=test 2>&1 | tee test.log
          # Fail the job if the runner reported any failed/error tests.
          if grep -qE "[1-9][0-9]* failed|[1-9][0-9]* error\(s\)" test.log; then
            echo "::error::Tests reported failures or errors"
            exit 1
          fi

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-pg${{ matrix.postgres }}
          path: test.log
          retention-days: 7

      # Coverage report — only on manual workflow_dispatch to keep the
      # routine push runs fast. Run a second pass under coverage and
      # publish a per-module summary artifact.
      - name: Coverage report (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          # Fresh DB for the coverage pass so it doesn't reuse the
          # already-tested polimex_test state.
          psql -c "DROP DATABASE IF EXISTS polimex_cov;" postgres
          psql -c "CREATE DATABASE polimex_cov OWNER odoo;" postgres
          # Same tag list as the regular run.
          TAGS="rfid,rfid_vending,sot_denied,hr_attendance_late,rfid_site_manager,rfid_site_manager_tour,rfid_voting,refresh_mixin,rfid_service_lifecycle,rfid_service_portal_security,rfid_pms,rfid_odoo_import,rfid_old_cloud_import,polimex_ip_cam,rfid_portal,rfid_refresh_views,rfid_hourly_cost,rfid_zpl_labels,rfid_attendance_zone"
          coverage run --source=addons/polimex --omit='*/tests/*,*/__pycache__/*' \
            odoo/odoo-bin \
              -d polimex_cov \
              --test-enable --test-tags="$TAGS" \
              -i "${{ steps.modules.outputs.list }}" \
              --no-http --stop-after-init \
              --addons-path=odoo/addons,addons/polimex,addons/polimex-ws \
              --db_host=localhost --db_port=5432 \
              --db_user=odoo --db_password=odoo \
              --log-level=warn 2>&1 | tail -20 || true
          coverage report --skip-empty --sort=cover -m > coverage-report.txt || true
          echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --skip-empty --sort=cover | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report.txt
          retention-days: 30
